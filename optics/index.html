<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Optics workshop</title>
<meta name="description" content="An optical engineering game: build a burning glass, a pair of glasses, a camera lens and a solar tower on a bench where every ray is really traced.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070F">
<meta name="text-scale" content="scale">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=JetBrains+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="modulepreload" href="../js/optics/glass.js">
<link rel="modulepreload" href="../js/optics/trace.js">
<link rel="modulepreload" href="../js/optics/levels.js">
<link rel="modulepreload" href="../js/optics/chart.js">
<link rel="stylesheet" href="../css/optics.css">
</head>
<body>
<canvas id="view" role="img" aria-label="Side view of the bench. The panel describes it and holds every control." aria-describedby="capBody"></canvas>

<a class="back" href="../" aria-label="Back to all experiences">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14.5 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</a>
<div class="topright">
  <div class="scalebar" aria-hidden="true"><b id="scaleText"></b></div>
  <button type="button" class="chip" id="reset">Start over</button>
</div>
<p class="hint" id="hint"></p>

<main class="panel" id="panel">
  <header class="title">
    <h1>Optics workshop</h1>
    <span>build things that bend light</span>
  </header>

  <nav class="stages" id="levels" aria-label="Challenge"></nav>

  <div class="cap" id="cap">
    <div class="eyebrow" id="eyebrow"></div>
    <h2 id="capTitle"></h2>
    <p id="capBody"></p>
  </div>

  <div class="meters" id="meters"></div>
  <div class="controls" id="controls"></div>

  <div class="step">
    <button type="button" id="prev" class="btn">‹ Previous</button>
    <button type="button" id="next" class="btn">Next ›</button>
  </div>

  <div class="won" id="won" hidden>
    <h3>Solved. What you just built</h3>
    <p id="learned"></p>
  </div>
  <p class="visually-hidden" id="status" role="status"></p>

  <div class="readout">
    <dl id="rows"></dl>
    <ul class="scenekey" id="key" aria-label="In the picture"></ul>
  </div>
</main>

<script type="module" src="../js/optics/main.js"></script>
</body>
</html>
