<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rainbows</title>
<meta name="description" content="Interactive explorations of how rainbows form.">
<meta name="theme-color" content="#05070F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#05070F;--ink:#EAF0FF;--ink2:#AAB6D6;--line:rgba(234,240,255,.14);--focus:#9FB4FF;
  --display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;--body:'Source Sans 3','Segoe UI',Roboto,sans-serif;
  --spectrum:linear-gradient(90deg,#7b2cff,#3b5bff,#00b0d8,#3ccf5a,#f2d41d,#ff7a1a,#e8202b)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.45}
body{min-height:100vh;display:grid;place-items:center;padding:32px 16px}
main{width:100%;max-width:420px;text-align:center;display:grid;gap:28px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(34px,9vw,48px);letter-spacing:-.02em;line-height:1.05;margin:0}
.bar{height:6px;border-radius:3px;background:var(--spectrum);margin:14px auto 0;width:96px}
p{margin:0;color:var(--ink2)}
nav{display:grid;gap:12px}
.btn{display:block;padding:16px 20px;border-radius:14px;border:1px solid var(--line);background:rgba(234,240,255,.08);color:var(--ink);text-decoration:none;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em}
.btn:hover{background:rgba(234,240,255,.16)}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
</style>
</head>
<body>
<main>
  <header>
    <h1>Rainbows</h1>
    <div class="bar" aria-hidden="true"></div>
  </header>
  <nav aria-label="Experiences">
    <a class="btn" href="v1/">Rainbows v1</a>
  </nav>
</main>
</body>
</html>
