<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Graph layout</title>
<meta name="description" content="Two ways to draw a directed graph, one step at a time: in layers, as ELK does, and by a seeded search on a grid, standing in for TALA.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070F">
<meta name="text-scale" content="scale">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=JetBrains+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="modulepreload" href="../js/dag/common.js">
<link rel="modulepreload" href="../js/dag/graphs.js">
<link rel="modulepreload" href="../js/dag/route.js">
<link rel="modulepreload" href="../js/dag/layered.js">
<link rel="modulepreload" href="../js/dag/search.js">
<link rel="stylesheet" href="../css/dag.css">
</head>
<body>
<canvas id="view" tabindex="0" role="img" aria-label="The graph as it is drawn at this step. The arrow keys pick out one node and its edges; Escape lets go." aria-describedby="capText"></canvas>

<a class="back" href="../" aria-label="Back to all experiences">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14.5 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</a>

<main class="panel" id="panel">
  <header class="title">
    <h1>Graph layout</h1>
    <span>two ways to draw a directed graph</span>
  </header>

  <div class="ctl">
    <div class="lab"><label for="graph">Graph</label><b id="graphFacts"></b></div>
    <select id="graph"></select>
  </div>

  <div class="ctl">
    <div class="seg" id="method" role="group" aria-label="Method">
      <button type="button" data-v="layered">Layered · ELK</button>
      <button type="button" data-v="search">Search · TALA</button>
    </div>
    <p class="note" id="methodNote"></p>
  </div>

  <nav class="stages" id="stages" aria-label="Step"></nav>

  <div class="cap">
    <div class="eyebrow" id="eyebrow"></div>
    <h2 id="capTitle"></h2>
    <p id="capText"></p>
  </div>

  <div class="meters" id="meters"></div>
  <p class="pick" id="pick"></p>

  <div class="controls" id="controls"></div>
  <div class="tries" id="tries" aria-hidden="true" hidden></div>

  <div class="step">
    <button type="button" id="prev" class="btn">Back</button>
    <button type="button" id="play" class="btn primary">Play the steps</button>
    <button type="button" id="next" class="btn">Next</button>
  </div>
  <p class="visually-hidden" id="status" role="status"></p>
</main>

<script type="module" src="../js/dag/main.js"></script>
</body>
</html>
